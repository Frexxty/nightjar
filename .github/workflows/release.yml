name: Release

# Push a vX.Y.Z tag and this builds the macOS and Windows installers and
# publishes them as one GitHub release.
#
# The jobs share a single release without racing:
#   1. prepare creates a *draft* release for the tag, with notes from
#      CHANGELOG.md (or the tag annotation).
#   2. The build jobs run electron-builder with EP_DRAFT=true, so each one
#      finds that draft by tag and uploads into it instead of creating its own.
#   3. publish checks every expected asset is there, then flips the draft to
#      published. Until then nothing is public, so /releases/latest and the
#      in-app updater never see a half-uploaded release. If a build fails the
#      draft stays a draft; re-run the failed job and it uploads again.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      # checkout on a tag push leaves a lightweight ref; fetch the real tag
      # so its annotation is readable for the release notes.
      - run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: version
        name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" --out release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" = "true" ]; then
              echo "Draft for $TAG already exists; reusing it."
              exit 0
            fi
            echo "::error::Release $TAG is already published. Bump the version and tag again."
            exit 1
          fi
          flags=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" --draft --verify-tag $flags \
            --title "Stratus ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # One electron-builder run builds both mac arches, so it writes a
          # single latest-mac.yml listing both zips. x64 cross-builds fine on
          # the arm64 runner because the app has no native modules.
          - os: macos-14
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # electron-builder copies build/release-notes.md into latest.yml and
      # latest-mac.yml, which is where the in-app dialog reads notes from.
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: build
      - name: Build and upload to the draft release
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ github.token }}
          EP_DRAFT: "true"
          # No signing certificates: macOS builds are ad-hoc signed through
          # mac.identity "-" in package.json, Windows builds are unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check every asset was uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          missing=0
          for name in \
            Stratus-mac-arm64.dmg Stratus-mac-x64.dmg \
            Stratus-mac-arm64.zip Stratus-mac-x64.zip \
            Stratus-Setup-x64.exe Stratus-Setup-x64.exe.blockmap \
            latest.yml latest-mac.yml; do
            if ! printf '%s\n' "$assets" | grep -qx "$name"; then
              echo "::error::Missing release asset $name"
              missing=1
            fi
          done
          exit $missing
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
