name: Release

# Push a vX.Y.Z tag and this builds the macOS and Windows installers (and,
# best effort, a Linux AppImage) and publishes them as one GitHub release.
# With the EVS_ACCOUNT_NAME and EVS_PASSWD secrets set, the macOS and Windows
# apps are also Widevine VMP-signed (README, Releasing).
#
# The jobs share a single release without racing:
#   1. prepare creates a *draft* release for the tag, with notes from
#      CHANGELOG.md (or the tag annotation).
#   2. The build jobs run electron-builder with EP_DRAFT=true, so each one
#      finds that draft by tag and uploads into it instead of creating its own.
#   3. publish checks every expected asset is there, then flips the draft to
#      published. Until then nothing is public, so /releases/latest and the
#      in-app updater never see a half-uploaded release. If a build fails the
#      draft stays a draft; re-run the failed job and it uploads again.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      # checkout on a tag push leaves a lightweight ref; fetch the real tag
      # so its annotation is readable for the release notes.
      - run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: version
        name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" --out release-notes.md
      - uses: actions/upload-artifact@v5
        with:
          name: release-notes
          path: release-notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" = "true" ]; then
              echo "Draft for $TAG already exists; reusing it."
              exit 0
            fi
            echo "::error::Release $TAG is already published. Bump the version and tag again."
            exit 1
          fi
          flags=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" --draft --verify-tag $flags \
            --title "Nightjar ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # One electron-builder run builds both mac arches, so it writes a
          # single latest-mac.yml listing both zips. x64 cross-builds fine on
          # the arm64 runner because the app has no native modules.
          - os: macos-15
            target: --mac
            # Where electron-builder leaves the unpacked apps, for the checks.
            unpacked: release/mac-arm64 release/mac
          - os: windows-latest
            target: --win
            unpacked: release/win-unpacked
    runs-on: ${{ matrix.os }}
    env:
      # "true" when both EVS secrets are set. Without them (forks, or before
      # the maintainer adds them) the build still succeeds; scripts/vmp-sign.cjs
      # warns and the app keeps castlabs' development VMP signature only.
      HAS_EVS: ${{ secrets.EVS_ACCOUNT_NAME != '' && secrets.EVS_PASSWD != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # electron-builder copies build/release-notes.md into latest.yml and
      # latest-mac.yml, which is where the in-app dialog reads notes from.
      - uses: actions/download-artifact@v5
        with:
          name: release-notes
          path: build
      # The castlabs EVS client does the Widevine VMP signing (see
      # scripts/vmp-sign.cjs). setup-python gives a pip that may install
      # packages; the runners' system Pythons refuse (PEP 668).
      - uses: actions/setup-python@v7
        id: python
        if: env.HAS_EVS == 'true'
        with:
          python-version: "3.13"
      - name: Install the castlabs EVS client
        if: env.HAS_EVS == 'true'
        run: '"$EVS_PYTHON" -m pip install --upgrade castlabs-evs'
        env:
          EVS_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Build and upload to the draft release
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ github.token }}
          EP_DRAFT: "true"
          # No signing certificates: macOS builds are ad-hoc signed through
          # mac.identity "-" in package.json, Windows builds are unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # VMP signing. Only this step sees the password.
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_PYTHON: ${{ steps.python.outputs.python-path }}
      # A failure here leaves the release a draft: publish needs this job.
      - name: Check the code and VMP signatures
        env:
          EVS_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            for dir in ${{ matrix.unpacked }}; do
              codesign --verify --deep --strict --verbose=1 "$dir/Nightjar.app"
            done
          fi
          if [ "$HAS_EVS" = true ]; then
            # Offline check: production VMP signature present and matching.
            "$EVS_PYTHON" -m castlabs_evs.vmp --no-ask verify-pkg --name-hint Nightjar ${{ matrix.unpacked }}
          fi

  # Linux AppImage, best effort: it isn't part of the release contract yet, so
  # a failure here doesn't hold the release back (publish only warns when the
  # AppImage is missing). Widevine on Linux has no VMP, so nothing to sign.
  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v5
        with:
          name: release-notes
          path: build
      - name: Build and upload to the draft release
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ github.token }}
          EP_DRAFT: "true"

  publish:
    needs: [prepare, build, build-linux]
    # Wait for build-linux so it can't upload into an already published
    # release, but don't require it to have succeeded.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check every asset was uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          missing=0
          for name in \
            Nightjar-mac-arm64.dmg Nightjar-mac-x64.dmg \
            Nightjar-mac-arm64.zip Nightjar-mac-x64.zip \
            Nightjar-Setup-x64.exe Nightjar-Setup-x64.exe.blockmap \
            latest.yml latest-mac.yml; do
            if ! printf '%s\n' "$assets" | grep -qx "$name"; then
              echo "::error::Missing release asset $name"
              missing=1
            fi
          done
          for name in Nightjar-linux-x86_64.AppImage latest-linux.yml; do
            if ! printf '%s\n' "$assets" | grep -qx "$name"; then
              echo "::warning::Linux asset $name is missing; publishing without it"
            fi
          done
          exit $missing
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
