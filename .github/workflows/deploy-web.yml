name: Deploy web player

# Builds the web player and deploys it to nightjar-app.k3s.lat (Worker
# `stratus-app`, config in web/wrangler.jsonc; the old stratus-app.k3s.lat
# address redirects there, see web/worker.js).
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   an API token with "Workers Scripts: Edit" on the account
#                          and "Workers Routes: Edit" + "DNS: Edit" on the k3s.lat zone
#   CLOUDFLARE_ACCOUNT_ID  f2cf5d525fceb6c6c5fccbbd10a94bb4

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "web/**"
      - ".env.web"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      # Forks and repos without the secrets still get a build check, just no deploy.
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, skipping deploy"
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler@latest deploy --config web/wrangler.jsonc
