name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Typecheck, Vite and the node tests don't need the Electron binary, and
    # npm ci doesn't fetch it: the electron package (castlabs ECS, from GitHub)
    # has no install script and downloads the binary the first time something
    # requires "electron". ELECTRON_SKIP_BINARY_DOWNLOAD has nothing to skip.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build
      - run: npm test
